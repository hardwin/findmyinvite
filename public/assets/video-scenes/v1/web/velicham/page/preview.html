<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>First Light — template v1 (core film B1 → B2 → B4 → B5 → B9)</title>
  <style>
    html, body { margin: 0; background: #2B3770; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #2B3770; }
    #gl { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
  </style>
  <script type="importmap">
    { "imports": { "three": "./assets/vendor/three/three.module.js", "three/addons/": "./assets/vendor/three/addons/" } }
  </script>
</head>
<body>
  <!-- per order: write assets/details.js, run node tools/setduration.mjs, render. plan(details-min) B1 0–3.8 · B2 3.8–9.0 · B4 9.0–18.8 · B5 18.8–26.6 · B9 26.6–38.8 (38.8 s, 2328 frames at 60 fps) -->
  <div id="root" data-composition-id="first-light" data-no-timeline data-width="1080" data-height="1920" data-duration="38.8">
    <canvas id="gl" width="1080" height="1920"></canvas>
  </div>
  <script type="module">
    // GENERATED by build/build-page.mjs — the editor's live preview of design velicham (see the lock's index.html)
    import { THREE, Film, texLoads } from "./assets/engine/depth3d.js";
    import { buildCore, GRADE } from "./core.js";
    import { DETAILS } from "./assets/details.js";
    import { applyStyle } from "./style/velicham-style.js";
    let D = DETAILS, cap = 0;
    try { if (window.parent && window.parent !== window) { if (window.parent.__vinvPageDetails) D = window.parent.__vinvPageDetails; cap = Number(window.parent.__vinvTexCap) || 0; } } catch { /* another origin */ }
    if (!cap) cap = matchMedia("(pointer: coarse)").matches || Math.min(screen.width, screen.height) < 700 ? 1536 : 2560;
    for (const C of [window.WebGL2RenderingContext, window.WebGLRenderingContext]) {
      if (!C) continue;
      const gp = C.prototype.getParameter;
      C.prototype.getParameter = function (p) { const v = gp.call(this, p); return p === 0x0D33 ? Math.min(v, cap) : v; };   // MAX_TEXTURE_SIZE
    }
    document.documentElement.lang = "en";
    window.__FILM__ = true;
    window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
    let film, ready = false, lastT = 0;
    window.__hf.buildReady.film = (async () => {
      await applyStyle(D.style, D);
      film = new Film(document.getElementById("gl"), { toneMapping: THREE.NoToneMapping, grade: GRADE });
      window.__film = film;
      const C = await buildCore(film, D);
      window.__filmDuration = C.duration;
      await Promise.all(texLoads);
      ready = true;
      film.renderAt(lastT);
    })();
    window.__filmAt = (t) => { lastT = t; if (film && ready) film.renderAt(t); };
  </script>
</body>
</html>

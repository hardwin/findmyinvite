    @font-face { font-family: "Great Vibes"; src: url("assets/fonts/great-vibes-latin-400.woff2") format("woff2"); font-weight: 400; }
    @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/cormorant-garamond-latin-600.woff2") format("woff2"); font-weight: 600; }
    :root { --ink: #1f3a63; --ink2: #6e2a3a; }
    html, body { margin: 0; background: #cfe6f6; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #cfe6f6; }
    .lay { position: absolute; display: block; max-width: none; }
    img.lay { height: auto; }
    .scene { overflow: hidden; }
    /* v2 (owner 2026-11-07: "reduce the haze in total video"): dehaze grade on the pictures only, text untouched */
    .scene { filter: brightness(0.86) contrast(1.28) saturate(1.18) !important; }   /* !important: the engine writes filter:none inline each frame */
    /* text pinned over the pale sky like the reference: deep navy / wine ink (never black), soft cream halo */
    .txl { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 40; pointer-events: none; }
    .tx { position: absolute; white-space: nowrap; color: var(--ink); line-height: 1.1; text-align: center;
      transform: translate(-50%, -50%); text-shadow: 0 0 6px rgba(255, 252, 244, 0.95), 0 0 18px rgba(255, 252, 244, 0.8); }
    .tx span { display: inline-block; }
    .tx .heart { margin: 0 0.28em; vertical-align: 0.05em; }
    .script { font-family: "Great Vibes"; font-weight: 400; }
    .body { font-family: "Cormorant Garamond"; font-weight: 600; }
    .noglow { text-shadow: none; }   /* owner (draft 4): no white glow on the save-the-date text */
    .names { letter-spacing: 0.04em; }
    .kick { color: var(--ink2); }
    .road { -webkit-mask-image: linear-gradient(transparent 0%, #000 22%, #000 78%, transparent 100%); mask-image: linear-gradient(transparent 0%, #000 22%, #000 78%, transparent 100%); }
    .petal { width: 22px; height: 14px; border-radius: 60% 40% 60% 40%; }
    .petal.m { background: radial-gradient(circle at 35% 35%, #ffd27a, #ee8a1e 75%); }
    .petal.r { background: radial-gradient(circle at 35% 35%, #ffd0dc, #e0708e 75%); }
    .spark { width: 160px; height: 160px; border-radius: 50%;

  <script type="module">
    import { DETAILS as SAMPLE } from "./assets/details.js";
    // GENERATED (page-poonga.mjs): the editor's live preview — the details from the parent window (the editor sets
    // window.__vinvPageDetails before it loads this page), the film's time from the parent through window.__filmAt(t)
    let DETAILS = SAMPLE;
    try { if (window.parent && window.parent !== window && window.parent.__vinvPageDetails) DETAILS = window.parent.__vinvPageDetails; } catch { /* another origin */ }
    window.__FILM__ = true; window.__filmDuration = Number(document.getElementById("root").dataset.duration);
    import { build } from "./assets/film.js";
    import { renderAll } from "./assets/engine.js";

    window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
    let film = null, ready = false;
    window.__hf.buildReady.film = (async () => {
      const root = document.getElementById("root");
      await Promise.all(['80px "Great Vibes"', '600 48px "Cormorant Garamond"'].map((f) => document.fonts.load(f, "Save the Date ARUN & MEENA 0123456789")));

      await Promise.all([...document.querySelectorAll("img")].map((i) => (i.complete && i.naturalWidth ? Promise.resolve() : i.decode()).catch(() => console.warn("image failed", i.src))));
      for (const f of film.fits) f();
      ready = true;
    })();
    function renderAt(t) { if (!ready) return; film.render(t); renderAll(t); }
    window.__filmAt = (t) => renderAt(t);   // GENERATED (page-poonga.mjs): the editor drives the time
    window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));

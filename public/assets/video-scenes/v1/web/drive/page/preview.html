<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Save the Date Drive — variation (draft)</title>
  <style>
    /* Two fonts only: Great Vibes (the script title) + Cormorant Garamond (everything else). Both OFL. */
    @font-face { font-family: "Great Vibes"; src: url("assets/fonts/great-vibes-latin-400.woff2") format("woff2"); font-weight: 400; }
    @font-face { font-family: "Cormorant"; src: url("assets/fonts/cormorant-garamond-latin-600.woff2") format("woff2"); font-weight: 600; }
    :root { --cream: #fcfaf4; --halo: rgba(58, 34, 14, 0.55); }
    html, body { margin: 0; background: #b9ab97; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #b9ab97; }
    .full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #plate { position: absolute; display: block; }
    .abs { position: absolute; left: 0; top: 0; will-change: transform; }
    .palm { position: absolute; display: block; filter: drop-shadow(18px 26px 22px rgba(20, 30, 10, 0.45)); }
    #car { position: absolute; display: block; filter: drop-shadow(16px 22px 18px rgba(40, 28, 16, 0.5)); }

    /* text sits on the road: cream letters with a soft warm-dark halo (readability) */
    .txt { color: var(--cream); }   /* draft 3: no shadow or stroke (owner) */
    #det .big sup { font-size: 0.42em; vertical-align: 0; position: relative; top: -0.95em; margin-left: 0.04em; letter-spacing: 0.04em; }
    #std { position: absolute; left: 540px; top: 900px; white-space: nowrap; font-family: "Great Vibes"; font-size: 300px; line-height: 1; transform: translate(-50%, -50%) rotate(-90deg); }
    #det { position: absolute; left: 340px; width: 400px; top: 0; display: flex; flex-direction: column; align-items: center; text-align: center; font-family: "Cormorant"; font-weight: 600; }
    #det .big { font-variant-numeric: lining-nums; font-feature-settings: "lnum" 1; font-size: 150px; line-height: 0.98; letter-spacing: 0.02em; text-transform: uppercase; white-space: nowrap; }
    #det .small { font-size: 50px; line-height: 1.05; white-space: nowrap; }
    #det .name { font-size: 150px; line-height: 1.0; white-space: nowrap; }
    #det .amp { font-size: 120px; line-height: 0.95; }
    #det .venue { font-size: 50px; line-height: 1.12; max-width: 400px; }

    #det .gap1 { height: 46px; } #det .gap2 { height: 50px; } #det .gap3 { height: 44px; }
    

  </style>
  <script>/* GENERATED (build-page.mjs): lite preview switch — the page laid out at the preview box's size */
    if (/[?&]lite=1/.test(location.search)) {
      document.documentElement.classList.add("lite");
      window.__vinvZoom = (z) => { document.documentElement.style.zoom = String(z); };
    }
  </script>
</head>
<body>
  <div id="root" data-composition-id="drive-variation" data-start="0" data-width="1080" data-height="1920" data-duration="20" data-no-timeline>
    <!-- silent draft; never whoosh/swoosh -->
  </div>
  <script type="module">
    import { DETAILS as SAMPLE } from "./assets/details.js";
    // GENERATED (build-page.mjs): the editor's live preview — the details from the parent window, the time from the parent
    let DETAILS = SAMPLE;
    try { if (window.parent && window.parent !== window && window.parent.__vinvPageDetails) DETAILS = window.parent.__vinvPageDetails; } catch { /* another origin */ }
    window.__FILM__ = true; window.__filmDuration = 20;
    import { build } from "./assets/film.js";
    import { fitLong } from "./style/drive-fit.js";   // GENERATED (build-page.mjs): long names start smaller
    window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
    let render = null;
    window.__hf.buildReady.film = (async () => {
      const root = document.getElementById("root");
      await Promise.all(['400 200px "Great Vibes"', '600 80px "Cormorant"'].map((f) => document.fonts.load(f, "Aa")));
      render = build(root, DETAILS);
      fitLong(root);   // GENERATED (build-page.mjs): before the lock's fit()
      await Promise.all([...root.querySelectorAll("img")].map((i) => (i.complete && i.naturalWidth ? Promise.resolve() : i.decode()).catch(() => console.warn("image failed", i.src))));
      await render.ready;
      render.fit();
    })();
    function renderAt(t) { if (render) render.at(t); }
    window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
    window.__hf.buildReady.film.then(() => renderAt(window.__hfThreeTime || 0));
    window.__renderAt = renderAt;
    window.__filmAt = (t) => renderAt(t);   // GENERATED (build-page.mjs): the editor drives the time
  </script>
</body>
</html>

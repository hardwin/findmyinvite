<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Kovil Mandapam (Blender) — words</title>
  <style>
    @font-face { font-family: "Great Vibes"; src: url("assets/fonts/great-vibes-latin-400.woff2") format("woff2"); font-weight: 400; }
    @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/cormorant-garamond-latin-600.woff2") format("woff2"); font-weight: 600; }
    @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/cormorant-garamond-latin-600-italic.woff2") format("woff2"); font-weight: 600; font-style: italic; }
    @font-face { font-family: "Noto Serif Tamil"; src: url("assets/fonts/noto-serif-tamil-tamil-600.woff2") format("woff2"); font-weight: 600; unicode-range: U+0964-0965, U+0B82-0BFA, U+200C-200D, U+20B9, U+25CC; }
    @font-face { font-family: "Noto Serif Tamil"; src: url("assets/fonts/noto-serif-tamil-tamil-500.woff2") format("woff2"); font-weight: 500; unicode-range: U+0964-0965, U+0B82-0BFA, U+200C-200D, U+20B9, U+25CC; }
    @font-face { font-family: "Arima"; src: url("assets/fonts/arima-tamil-700.woff2") format("woff2"); font-weight: 700; unicode-range: U+0964-0965, U+0B82-0BFA, U+200C-200D, U+20B9, U+25CC; }
    @font-face { font-family: "Arima"; src: url("assets/fonts/arima-latin-700.woff2") format("woff2"); font-weight: 700; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212, U+FEFF, U+FFFD; }
    @font-face { font-family: "Arima"; src: url("assets/fonts/arima-latin-500.woff2") format("woff2"); font-weight: 500 600; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212, U+FEFF, U+FFFD; }
    html, body { margin: 0; background: transparent; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="mandapam-blender-words" data-no-timeline data-width="1080" data-height="1920" data-fps="60" data-duration="54.2"></div>
  <script type="module">
    import { FACES, SAMPLE_TEXT, setLang } from "./assets/type2d.js";
    import { loadPlates, build, drawAt } from "./assets/overlay.js";
    import { DETAILS } from "./assets/details.js";
    // the editor's live preview may hand its details down (as template 17: window.__vinvPageDetails)
    let D = DETAILS;
    try { if (window.parent && window.parent !== window && window.parent.__vinvPageDetails) D = window.parent.__vinvPageDetails; } catch { /* another origin */ }
    const root = document.getElementById("root");
    let F = null;
    window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
    window.__hf.buildReady.film = (async () => {
      await Promise.all(FACES.map((f) => document.fonts.load(f, SAMPLE_TEXT)));
      // the customer's font set (DIY app): its faces first (classic / none: nothing to load)
      if (D.style && D.style.fontSet && D.style.fontSet !== "classic") await (await import("./assets/style/apply.js")).loadFaces(D.style);
      setLang(D);
      const PL = await loadPlates(["hall", "aerial", "board", "invite", "recep", "mandapam", "kolam"]);
      F = build(root, D, PL);
      root.dataset.duration = String(F.duration);
      window.__filmDuration = F.duration;
    })();
    function renderAt(t) { if (F) drawAt(t, F); }
    window.__filmAt = (t) => renderAt(t);
    window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
    window.__hf.buildReady.film.then(() => renderAt(window.__hfThreeTime || 0));
  </script>
</body>
</html>

      background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(0 2px 3px rgba(40, 0, 4, 0.75)) drop-shadow(0 0 12px rgba(40, 0, 4, 0.5)); }

  <script>/* GENERATED (page-poonga.mjs): lite preview switch */

      document.documentElement.classList.add("lite");
      const d = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, "src");
      Object.defineProperty(HTMLImageElement.prototype, "src", { ...d, set(v) { d.set.call(this, String(v).replace("assets/img/", "assets/img-lite/")); } });
      window.__vinvZoom = (z) => { document.documentElement.style.zoom = String(z); };

<body>
  <div id="root" data-composition-id="reel-de9tvb" data-start="0" data-width="1080" data-height="1920" data-duration="33" data-no-timeline>
    <!-- sound (owner d15): NO music — only a harp sparkle as the petals pass to her palm and a peacock call when it looks up
         (tools/mix-sfx.sh → assets/audio/sfx.wav; effects are our own ElevenLabs sounds). Never whoosh/swoosh. -->
  </div>
  <script type="module">
    import { DETAILS as SAMPLE } from "./assets/details.js";
    // GENERATED (page-poonga.mjs): the editor's live preview — the details from the parent window (the editor sets
    // window.__vinvPageDetails before it loads this page), the film's time from the parent through window.__filmAt(t)
    let DETAILS = SAMPLE;
    try { if (window.parent && window.parent !== window && window.parent.__vinvPageDetails) DETAILS = window.parent.__vinvPageDetails; } catch { /* another origin */ }
    window.__FILM__ = true; window.__filmDuration = Number(document.getElementById("root").dataset.duration);
    import { build } from "./assets/film.js";
    import { renderAll } from "./assets/engine.js";

    window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
    let film = null, ready = false;
    window.__hf.buildReady.film = (async () => {
      const root = document.getElementById("root");
      await Promise.all(['80px "ATM 378"', '48px "ATM 344"'].map((f) => document.fonts.load(f, "திருமண அழைப்பிதழ் ஶ்ரீ 0123456789")));
      film = build(root, DETAILS);
      await Promise.all([...document.querySelectorAll("img")].map((i) => (i.complete && i.naturalWidth ? Promise.resolve() : i.decode()).catch(() => console.warn("image failed", i.src))));
      for (const f of film.fits) f();
      ready = true;
    })();
    function renderAt(t) { if (!ready) return; film.render(t); renderAll(t); }
    window.__filmAt = (t) => renderAt(t);   // GENERATED (page-poonga.mjs): the editor drives the time
    window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
    window.__hf.buildReady.film.then(() => renderAt(window.__hfThreeTime || 0));
    window.__renderAt = renderAt;
  </script>

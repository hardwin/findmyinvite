  <script type="module">
    import { DETAILS as SAMPLE } from "./assets/details.js";

    let DETAILS = SAMPLE;
    try { if (window.parent && window.parent !== window && window.parent.__vinvPageDetails) DETAILS = window.parent.__vinvPageDetails; } catch { /* another origin */ }
    window.__FILM__ = true; window.__filmDuration = Number(document.getElementById("root").dataset.duration);
    import { build } from "./assets/film.js";

  <script>/* GENERATED (page-poonga.mjs cfg.video): the lock's clip, played by the preview itself (no HyperFrames runtime here) */
  (() => {
    const v = document.getElementById("walk"), END = 10.2;

    const p = v.play();
    if (p && p.then) p.then(() => { if (!flowing()) { v.pause(); if (Math.abs(v.currentTime - wantT) > 0.02) v.currentTime = wantT; } }, () => {});
    const flowing = () => performance.now() - lastAt < 220;
    window.__vinvVideoStill = async (t) => {
      lastT = -1; lastAt = 0; wantT = Math.min(Math.max(t, 0), END - 0.04);
      v.pause();
      const waitFor = (event, action) => new Promise((resolve, reject) => {
        const cleanup = () => { clearTimeout(timer); v.removeEventListener(event, done); v.removeEventListener('error', failed); };
        const done = () => { cleanup(); resolve(); };
        const failed = () => { cleanup(); reject(new Error('The moving illustration could not load.')); };
        const timer = setTimeout(failed, 15000);

      lastT = t; lastAt = now; wantT = Math.min(Math.max(t, 0), END - 0.04);

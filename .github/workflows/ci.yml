name: Verify and deploy
on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment environment
        required: true
        default: preview
        type: choice
        options: [preview, production]
permissions:
  contents: read
concurrency:
  group: findmyinvite-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Add bundled media tools to PATH
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import path from "node:path"; import ffmpeg from "ffmpeg-static"; import ffprobe from "ffprobe-static"; fs.appendFileSync(process.env.GITHUB_PATH, [path.dirname(ffmpeg), path.dirname(ffprobe.path)].join("\n") + "\n");'
      - run: npm run test:server
      - run: npm run build
  deploy:
    if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request' && ((github.event_name == 'workflow_dispatch' && inputs.target == 'preview') || vars.ENABLE_PRODUCTION_DEPLOY == 'true')
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'preview' && 'preview' || 'production' }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DEPLOY_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx --yes vercel@59.16.0 pull --yes --environment="$DEPLOY_TARGET" --token="$VERCEL_TOKEN"
      - name: Build deployment
        run: |
          if [ "$DEPLOY_TARGET" = "production" ]; then
            npx --yes vercel@59.16.0 build --prod --token="$VERCEL_TOKEN"
          else
            npx --yes vercel@59.16.0 build --token="$VERCEL_TOKEN"
          fi
      - name: Deploy verified build
        run: |
          if [ "$DEPLOY_TARGET" = "production" ]; then
            npx --yes vercel@59.16.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          else
            npx --yes vercel@59.16.0 deploy --prebuilt --token="$VERCEL_TOKEN"
          fi

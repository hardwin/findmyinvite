<div id="stage">
  <canvas id="gl" aria-hidden="true"></canvas>

  <!-- one card per backwater stop; data-key is the stop (invite.js decides which stops this couple has; the rest are removed with their cards) -->
  <main id="ui">
    <section class="ch" data-key="welcome">
      <div class="plaque" style="top:6%">
        <p class="it rise sm" id="helloIntro" data-opt="2"></p>
        <p class="cap split" data-t="brand"></p>
        <h1 class="script split" data-t="names"></h1>
        <p class="cap split" data-t="marrying"></p>
        <p class="big split" data-t="dateShort"></p>
        <p class="it rise sm" data-t="blessing"></p>
        <p class="it rise sm" data-t="walkIn" data-opt="1"></p>
      </div>
    </section>
    <section class="ch" data-key="story">
      <div class="plaque" style="top:6%">
        <p class="cap split" data-t="storyLabel"></p>
        <p class="it rise story" data-t="story"></p>
      </div>
    </section>
    <section class="ch" data-key="engagement">
      <div class="plaque" style="top:6%">
        <p class="cap split" data-t="engLabel"></p>
        <p class="it rise" data-t="engWhen"></p>
        <p class="it rise sm" data-t="engWhere"></p>
      </div>
    </section>
    <section class="ch wed" data-key="wedding">
      <div class="plaque" style="top:5%">
        <p class="cap split" data-t="wedLabel"></p>
        <p class="big split" data-t="wedDate"></p>
        <p class="it rise" data-t="wedTime"></p>
        <div class="count rise">
          <div><b id="cd-d">0</b><i data-t="units.0"></i></div><div><b id="cd-h">0</b><i data-t="units.1"></i></div>
          <div><b id="cd-m">0</b><i data-t="units.2"></i></div><div><b id="cd-s">0</b><i data-t="units.3"></i></div>
        </div>
        <p class="it rise sm" data-t="venue"></p>
      </div>
    </section>
    <section class="ch rec" data-key="reception">
      <div class="plaque" style="top:6%">
        <p class="cap split" data-t="recLabel"></p>
        <p class="big split" data-t="recWhen"></p>
        <p class="it rise" data-t="recWhere"></p>
      </div>
    </section>
    <section class="ch end" data-key="end">
      <div class="plaque" style="top:6%">
        <h2 class="script split" data-t="thanks"></h2>
        <p class="it rise"><span id="helloEnd"></span><span data-t="thanksLine"></span></p>
      </div>
      <div class="acts rise">
        <button id="rsvpBtn" class="primary mag"><span data-t="btn.rsvp"></span></button>
        <div class="row">
          <a id="calBtn" class="mag" target="_blank" rel="noopener"><span data-t="btn.cal"></span></a>
          <a id="mapBtn" class="mag" target="_blank" rel="noopener"><span data-t="btn.map"></span></a>
        </div>
        <div class="row">
          <button id="shareBtn" class="mag"><span data-t="btn.share"></span></button>
          <button id="cardBtn" class="mag"><span data-t="btn.card"></span></button>
        </div>
      </div>
    </section>
    <section class="ch wish" data-key="wishes">
      <div class="plaque" style="top:6%">
        <p class="cap split" data-t="wishLabel"></p>
        <p class="it rise" data-t="wishHow"></p>
        <p class="big rise" id="wishCount"></p>
      </div>
    </section>
